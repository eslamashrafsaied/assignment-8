<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>What's For Dinner</title>
    <link rel="stylesheet" href="fonts/all.min.css">
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
</head>

<body>
    <nav class="navbar">
        <div class="container px-5">
            <div class="nav-left d-flex align-items-center justify-content-center">
                <div class="logo-icon">
                    <i class="fa-solid fa-utensils"></i>
                </div>
                <div class="brand-text">
                    <h1 class="m-0">What's For Dinner</h1>
                    <p class="mb-0">Your daily meal inspiration</p>
                </div>
            </div>
            <div class="nav-right">
                <div class="nav-icons">
                    <i class="fa-solid fa-bookmark" title="Saved"></i>
                    <i class="fa-solid fa-clock-rotate-left" title="History"></i>
                    <i class="fa-solid fa-gear" title="Settings"></i>
                </div>
                <img src="img/avatar-2.jpg" alt="Profile" class="profile-avatar" />
            </div>
        </div>
    </nav>

    <main class="py-5">
        <div>
            <div class="container all">
                <div class="row rounded-5">
                    <div id="image-hero" class="card-left col-md-5 p-0 position-relative">
                    </div>
                    <div class="card-right col-md-7 bg-white p-4">
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <div id="contentImage" class="d-flex">
                                </div>
                                <div id="HeaderFood">
                                </div>
                            </div>
                            <div class="fs-4 d-flex">
                                <button
                                    class="save-btn d-flex justify-content-center align-items-center text-center border-0 me-2 rounded-3">
                                    <span class="m-0 d-flex align-items-center">
                                        <i class="fs-6 fa-solid fa-bookmark" style="color: rgb(245, 73, 0);"></i>
                                    </span>
                                </button>
                                <button
                                    class="save-btn d-flex justify-content-center align-items-center text-center border-0 rounded-3">
                                    <span class="d-flex align-items-center">
                                        <i class="fs-6 fa-solid fa-share-nodes" style="color: rgb(245, 73, 0);"></i>
                                    </span>
                                </button>
                            </div>
                        </div>
                        <div id="aleart"></div>
                        <div>
                            <ul class="nav nav-tabs custom-tabs border-bottom" id="recipeTab" role="tablist">
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link active" id="ingredients-tab" data-bs-toggle="tab"
                                        data-bs-target="#ingredients" type="button" role="tab">
                                        <i class="fa-solid fa-list-check me-1"></i> Ingredients
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="instructions-tab" data-bs-toggle="tab"
                                        data-bs-target="#instructions" type="button" role="tab">
                                        <i class="fa-solid fa-book-open me-1"></i> Instructions
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="nutrition-tab" data-bs-toggle="tab"
                                        data-bs-target="#nutrition" type="button" role="tab">
                                        <i class="fa-solid fa-chart-pie me-1"></i> Nutrition
                                    </button>
                                </li>
                                <li class="nav-item" role="presentation">
                                    <button class="nav-link" id="tips-tab" data-bs-toggle="tab" data-bs-target="#tips"
                                        type="button" role="tab">
                                        <i class="fa-solid fa-lightbulb me-1"></i> Chef's Tips
                                    </button>
                                </li>
                            </ul>
                            <div class="tab-content pt-3" id="recipeTabContent">
                                <div class="tab-pane fade show active" id="ingredients" role="tabpanel">
                                    <div id="listIngredients" class="recipe-box p-1 rounded-4">

                                    </div>
                                </div>
                                <div class="tab-pane fade" id="instructions" role="tabpanel">
                                    <div id="listInstructions" class="recipe-box rounded-4">
                                    </div>
                                </div>
                                <div class="tab-pane fade" id="nutrition" role="tabpanel">
                                    <div id="kcal"></div>

                                </div>
                                <div class="tab-pane fade" id="tips" role="tabpanel">
                                    <div class="recipe-box p-1 rounded-4">
                                        <div id="tips" class="tips-container d-flex  flex-column gap-3"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="mt-4">
                            <button onclick="RandomIndex()" class="btn-try-again btn btn-primary">
                                <i class=" fa-solid fa-rotate-right me-1"></i>
                                <span>Try Another Recipe</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/index.js"></script>
</body>


</html>
